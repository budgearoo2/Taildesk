name: Publish TailDesk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish (for example 1.0.8); must match source'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication; never cancel a release already in progress.
concurrency:
  group: taildesk-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js for browser JavaScript syntax verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify private commit identities without rewriting published history
        shell: pwsh
        run: |
          $emails = @(git log --all --format="%ae%n%ce" | Sort-Object -Unique)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect commit identities." }
          $unsafeEmails = @($emails | Where-Object { $_ -notmatch '^[^@\s]+@users\.noreply\.github\.com$' })
          if ($emails.Count -eq 0 -or $unsafeEmails.Count -gt 0) {
            throw "Non-private commit identities found. Resolve privacy concerns separately before publishing."
          }

      - name: Read version and reject duplicate releases
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $source = Get-Content .\taildesk\__init__.py -Raw
          $match = [regex]::Match($source, '__version__\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $match.Success) { throw "taildesk.__version__ must be a semantic version such as 1.0.0." }
          $version = $match.Groups[1].Value
          if ($env:REQUESTED_VERSION -cne $version) { throw "Requested version must exactly match taildesk.__version__." }
          # Exact API lookup: only a confirmed 404 means the release is absent.
          $response = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" --include 2>&1 | Out-String
          $status = [regex]::Match($response, '(?m)^HTTP/\S+\s+(\d{3})').Groups[1].Value
          if ($status -eq '200') { throw "Release v$version already exists; published releases are immutable." }
          if ($status -ne '404') { throw "Could not confirm release absence; refusing publication." }
          $tags = @(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tags." }
          if ($tags.Count -gt 0) { throw "Tag v$version already exists; refusing to overwrite or reuse it." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r .\requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Packaging dependency installation failed." }

      - name: Build the self-contained Windows application and setup program
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --icon .\assets\taildesk.ico --name TailDesk --distpath .\dist\host --workpath .\build\host --collect-all soundcard --collect-all pycaw --collect-all comtypes --collect-all pystray --collect-all av --collect-all aiortc --collect-all pylibsrtp --collect-all dxcam --add-data ".\taildesk\web;taildesk\web" .\remote_desktop_connection.py
          if ($LASTEXITCODE -ne 0) { throw "Host packaging failed." }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon .\assets\taildesk.ico --name TailDesk-Setup --distpath .\dist\installer --workpath .\build\installer --add-data ".\dist\host\TailDesk;payload\TailDesk" .\installer.py
          if ($LASTEXITCODE -ne 0) { throw "Setup packaging failed." }
          Copy-Item .\dist\installer\TailDesk-Setup.exe ".\dist\TailDesk-Setup-$version.exe"

      - name: Package the source and publish a versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archive = ".\dist\TailDesk-$version.zip"
          $cleanHead = "${{ github.sha }}"
          git archive --format=zip --prefix="TailDesk-$version/" --output=$archive $cleanHead remote_desktop_connection.py installer.py taildesk assets tests requirements.txt README.md CHANGELOG.md UPDATE_PIPELINE.md AGENTS.md THIRD_PARTY_NOTICES.md LICENSE .github
          if ($LASTEXITCODE -ne 0) { throw "Could not package the tracked source tree." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $forbidden = $zip.Entries | Where-Object { $_.FullName -match '(^|/)(settings\.json|github-token\.dpapi|audio-routing\.json|\.env|__pycache__)(/|$)|\.(pem|pfx|p12|pyc|pyo)$' }
            if ($forbidden) { throw "Source archive contains generated or sensitive files." }
            foreach ($entry in $zip.Entries) {
              if ($entry.Length -eq 0 -or $entry.Length -gt 5000000) { continue }
              if ($entry.FullName -notmatch '\.(py|js|html|css|json|ya?ml|toml|md|txt|ini|cfg)$') { continue }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { $contents = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($contents -match '(?i)(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|tskey-[A-Za-z0-9-]{12,}|[a-z0-9-]+\.ts\.net|[A-Z]:\\Users\\[^\\\s"'']+)') {
                throw "Source archive scan found a credential, personal Tailnet endpoint, or local user path in $($entry.FullName)."
              }
            }
          } finally { $zip.Dispose() }
          gh release create "v$version" $archive ".\dist\TailDesk-Setup-$version.exe" --repo "$env:GITHUB_REPOSITORY" --target $cleanHead --title "TailDesk $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed; no existing release assets will be replaced." }
